[package]
name = "ssproxy"
version = "0.2.0"
edition = "2021"
description = "Embeddable, poll-driven SSH server/client with direct-tcpip streams"
license = "Apache-2.0 OR MIT"
rust-version = "1.83"

[lib]
name = "ssproxy"
path = "src/lib.rs"

[[bin]]
name = "ssproxyd"
path = "src/bin/ssproxyd.rs"
required-features = ["bin"]

[features]
default = ["pubkey", "ecdh", "mlkem"]
# Public-key user auth and OpenSSH PEM host keys (via ssh-key).
pubkey = ["dep:ssh-key", "dep:ssh-encoding", "dep:signature", "dep:rsa", "sha2/oid"]
# ecdh-sha2-nistp256/384/521 key exchange.
ecdh = ["dep:p256", "dep:p384", "dep:p521"]
# mlkem768x25519-sha256 hybrid post-quantum key exchange.
mlkem = ["dep:ml-kem"]
bin = ["dep:clap", "dep:env_logger", "tokio/rt-multi-thread", "tokio/macros", "tokio/signal", "tokio/net"]

[dependencies]
bytes = "1"
# chacha20-poly1305@openssh.com 的实现。aws-lc-rs 自带 OpenSSH 那个变体
# (aead::chacha20_poly1305_openssh)，汇编优化，且 **zfc 树里本来就有这一份**
# (russh 默认 backend 就是它，rustls 也拉它) —— 不引入新依赖。
aws-lc-rs = "1.16"
ed25519-dalek = { version = "2", features = ["rand_core", "std"] }
log = "0.4"
parking_lot = "0.12"
rand = "0.8"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["time", "sync", "io-util", "macros"] }
x25519-dalek = "2"

ssh-key = { version = "0.6", optional = true, default-features = false, features = ["std", "ed25519", "rsa", "p256", "p384", "p521"] }
ssh-encoding = { version = "0.2", optional = true }
signature = { version = "2", optional = true, default-features = false, features = ["std", "rand_core"] }
# RSA host keys. Same 0.9 line ssh-key 0.6 already pulls in; named directly to
# sign rsa-sha2-256 (ssh-key's own RSA signer is fixed to SHA-512).
rsa = { version = "0.9", optional = true, default-features = false, features = ["std", "u64_digit"] }
p256 = { version = "0.13", optional = true, default-features = false, features = ["ecdh", "std"] }
p384 = { version = "0.13", optional = true, default-features = false, features = ["ecdh", "std"] }
p521 = { version = "0.13", optional = true, default-features = false, features = ["ecdh", "std"] }
ml-kem = { version = "0.3.2", optional = true, default-features = false }

clap = { version = "4", optional = true, features = ["derive"] }
env_logger = { version = "0.11", optional = true }

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-util", "process", "test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
